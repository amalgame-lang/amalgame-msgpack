# Package manifest — amalgame-msgpack
#
# Pure-Amalgame MessagePack 1.0 subset codec — encodes/decodes via
# the existing `JsonValue` tree (Amalgame.Json), so callers can
# switch wire formats with a one-line rename:
#
#   let bytes = MsgPack.EncodeJson(jv)
#   let jv2   = MsgPack.DecodeJson(bytes)
#
# Originally bundled in amc's src/stdlib/msgpack.am; extracted into
# this external package as part of the framework split.
#
# Installation:
#
#   amc package add msgpack                  # via curated index
#   amc package add github.com/amalgame-lang/amalgame-msgpack@v0.1.0

[package]
name              = "amalgame-msgpack"
version           = "0.1.0"
license           = "Apache-2.0"
description       = "Pure-Amalgame MessagePack 1.0 subset codec via JsonValue tree."
authors           = ["Bastien Mouget"]
required-amalgame = ">=0.7.8"
schema-version    = 1

[stdlib]
class     = "MsgPack"
header    = "facade-stub.h"
namespace = "Amalgame.Formats.MsgPack"
facade    = "facade.am"
